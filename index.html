<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>E&amp;F Portfolio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="E&amp;F">
<meta name="theme-color" content="#eceef2">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="darkreader-lock">
<link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#eceef2; --surface:#ffffff; --ink:#0f1722; --muted:#5a6573; --faint:#98a2b0;
    --line:#e2e7ed; --accent:#1257d6;
    --green:#0c7a46; --green-soft:#e3f3ea; --red:#c2402f; --red-soft:#f8e9e6; --dip:#a85a4a; --dip-soft:#f6ece9;
    --sans:'IBM Plex Sans',-apple-system,system-ui,Segoe UI,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --shadow:0 1px 2px rgba(15,23,34,.05),0 6px 18px rgba(15,23,34,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  html{background:#eceef2;}
  body{
    background:#eceef2; color:var(--ink); font-family:var(--sans); line-height:1.42;
    padding:max(16px,env(safe-area-inset-top)) 14px calc(36px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  }
  .app{max-width:600px;margin:0 auto;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

  /* Topbar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 0;}
  .brand h1{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0;color:var(--ink);}
  .brand .sub{font-size:12.5px;color:#54607a;margin-top:3px;}
  .iconbtn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);}
  .iconbtn:active{transform:scale(.95);}
  .iconbtn svg{width:19px;height:19px;}
  .iconbtn.spin svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Controls row */
  .controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 4px 12px;}
  .status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;}
  .status .live-dot,.status .off-dot,.status .warn-dot,.status .dotpulse{width:8px;height:8px;border-radius:50%;flex:none;}
  .status .warn-dot{background:#d99423;box-shadow:0 0 0 3px #f7ecd6;}
  .freshdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle;}
  .freshdot.on{background:var(--green);}
  .freshdot.off{background:#c4ccd6;}
  .status .live-dot{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  .status .off-dot{background:var(--faint);}
  .status .dotpulse{background:var(--accent);animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  .switch-wrap{display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;}
  .switch-lbl{font-size:12.5px;color:var(--muted);font-weight:500;}
  .switch{position:relative;width:42px;height:25px;display:inline-block;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .track{position:absolute;inset:0;background:#cfd6df;border-radius:999px;transition:background .2s;}
  .knob{position:absolute;top:3px;left:3px;width:19px;height:19px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .switch input:checked + .track{background:var(--green);}
  .switch input:checked + .track + .knob{transform:translateX(17px);}

  /* Cards */
  .card,.hero{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);}
  .reveal{animation:rise .42s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* Hero */
  .hero{padding:18px 18px 17px;margin-bottom:13px;}
  .hero-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .hero-num{font-family:var(--mono);font-weight:600;font-size:clamp(38px,11vw,52px);line-height:1.04;letter-spacing:-.02em;margin:7px 0 3px;}
  .hero-num.pos{color:var(--green);} .hero-num.neg{color:var(--red);}
  .hero-sub{font-family:var(--mono);font-size:14px;color:var(--muted);font-weight:500;}
  .hero-sub .pct{color:var(--green);font-weight:600;}
  .hero-sub .pct.neg{color:var(--red);}
  .bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:16px 0 8px;background:#e8ebef;}
  .bar-invested{flex:1;background:#d4dae1;}
  .bar-gain{background:var(--green);min-width:5px;}
  .bar-legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);}
  .bar-legend .now{color:var(--ink);font-weight:600;}
  .reassure{font-size:13.5px;line-height:1.5;color:var(--muted);margin:16px 0 0;padding-left:12px;border-left:3px solid var(--green-soft);}
  .today{margin-top:14px;font-family:var(--mono);font-size:13px;font-weight:600;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .today.t-pos{color:var(--green);} .today.t-dip{color:var(--dip);}
  .today .today-note{font-family:var(--sans);font-weight:500;color:var(--faint);}

  /* Section heading */
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 4px 11px;}
  .sec-h h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0;}
  .sec-h .count{font-family:var(--mono);font-size:12px;color:var(--faint);}

  /* Holding cards */
  .holdings{display:flex;flex-direction:column;gap:11px;}
  .card{padding:15px 16px;cursor:pointer;transition:transform .12s,border-color .18s;}
  .card:active{transform:scale(.993);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px;}
  .name{font-weight:600;font-size:16px;letter-spacing:-.01em;}
  .ticker{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:3px;letter-spacing:.02em;}
  .cur{text-align:right;flex:none;}
  .cur-price{font-family:var(--mono);font-weight:600;font-size:16px;}
  .cur-share{font-size:11px;color:var(--faint);margin-top:2px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px;}
  .cell{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .cell .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:500;}
  .cell .v{font-family:var(--mono);font-weight:600;font-size:15px;}
  .pill{align-self:flex-start;font-family:var(--mono);padding:2px 8px;border-radius:6px;font-weight:600;font-size:14px;}
  .pill.g{background:var(--green-soft);color:var(--green);}
  .pill.r{background:var(--red-soft);color:var(--red);}
  .card-today{margin-top:12px;font-family:var(--mono);font-size:12px;font-weight:600;}
  .card-today.g{color:var(--green);} .card-today.dip{color:var(--dip);}
  .card-actions{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
  .update{background:#eef1f5;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;}
  .lookup{margin-left:auto;color:var(--accent);text-decoration:none;font-size:12.5px;font-weight:600;}

  /* Add + footer */
  .add{width:100%;margin-top:13px;background:none;border:1.5px dashed var(--line);color:var(--muted);border-radius:12px;padding:14px;font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer;transition:border-color .2s,color .2s;}
  .add:active{border-color:var(--accent);color:var(--accent);}
  footer{margin-top:26px;text-align:center;}
  footer .reassure-foot{color:var(--muted);font-size:13px;margin:0 0 6px;}
  footer .addr{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.02em;margin:0 0 14px;}
  .reset{background:none;border:none;color:var(--faint);font-size:12px;text-decoration:underline;cursor:pointer;font-family:var(--sans);}

  /* Modal */
  .backdrop{position:fixed;inset:0;background:rgba(15,23,34,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40;}
  .backdrop.show{opacity:1;pointer-events:auto;}
  .modal{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:18px 18px 0 0;
    padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
    transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.2);}
  .modal.show{transform:none;}
  .modal .grab{width:38px;height:4px;border-radius:2px;background:#d7dde4;margin:6px auto 14px;}
  .modal h2{font-size:19px;font-weight:600;margin:0 0 4px;}
  .modal .m-help{font-size:13px;color:var(--muted);margin:0 0 16px;}
  .modal label{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:12px;}
  .modal .m-row{display:flex;gap:11px;}
  .modal .m-row label{flex:1;}
  .modal input{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--ink);background:#f6f8fa;border:1px solid var(--line);border-radius:9px;padding:11px 12px;outline:none;text-transform:none;letter-spacing:0;}
  .modal input:focus{border-color:var(--accent);background:#fff;}
  .modal label.lead input{font-size:19px;border-color:var(--accent);background:#fff;}
  .modal .hint{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400;font-size:11px;font-family:var(--sans);}
  .m-actions{display:flex;align-items:center;gap:10px;margin-top:6px;}
  .m-actions .spacer{flex:1;}
  .btn{border:none;border-radius:10px;padding:12px 17px;font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer;}
  .primary{background:var(--accent);color:#fff;}
  .ghost{background:#eef1f5;color:var(--ink);}
  .danger{background:none;color:var(--red);padding:12px 4px;}
  .err{color:var(--red);font-size:13px;margin:-4px 0 12px;font-weight:600;display:none;}

  /* Passcode lock */
  .lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));}
  .lock.show{display:flex;}
  .lock-card{width:100%;max-width:330px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:26px 24px 20px;text-align:center;}
  .lock-logo{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.22em;color:var(--accent);margin-bottom:18px;}
  .lock-title{font-size:20px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em;}
  .lock-help{font-size:13.5px;color:var(--muted);margin:0 0 18px;line-height:1.5;}
  .lock-input{width:100%;font-family:var(--mono);font-size:24px;text-align:center;letter-spacing:.3em;color:var(--ink);
    background:#f6f8fa;border:1px solid var(--line);border-radius:11px;padding:13px 12px;outline:none;}
  .lock-input:focus{border-color:var(--accent);background:#fff;}
  .lock-err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin:10px 0 0;}
  .lock-go{width:100%;margin-top:8px;}
  .lock-bio{width:100%;margin-top:10px;}
  .lock-remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--muted);cursor:pointer;}
  .lock-remember input{width:16px;height:16px;accent-color:var(--accent);}
  .lock-reset{display:block;width:100%;margin-top:14px;background:none;border:none;color:var(--faint);font-size:12px;
    text-decoration:underline;cursor:pointer;font-family:var(--sans);}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
  <header class="topbar">
    <div class="brand">
      <h1>E&amp;F Portfolio</h1>
      <div class="sub">Private &middot; long-term investments</div>
    </div>
    <button class="iconbtn" id="refreshBtn" title="Refresh prices" aria-label="Refresh prices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="controls">
    <div class="status" id="statusline"></div>
    <label class="switch-wrap"><span class="switch-lbl">Calm</span>
      <span class="switch"><input type="checkbox" id="calm"><span class="track"></span><span class="knob"></span></span>
    </label>
  </div>

  <section id="hero"></section>

  <div class="sec-h"><h2>Holdings</h2><span class="count" id="hcount"></span></div>
  <section class="holdings" id="holdings"></section>
  <button class="add" id="addBtn">+&nbsp; Add a holding</button>

  <footer>
    <p class="reassure-foot">Saved privately on this device &mdash; no account, no sign-in.</p>
    <button class="reset" id="resetBtn">Restore original figures</button>
  </footer>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="modal" id="modal">
  <div class="grab"></div>
  <h2 id="mTitle">Update holding</h2>
  <p class="m-help" id="mHelp">Live prices update on their own. You can also override anything here.</p>
  <label class="lead">Current price<input id="f-current" type="text" inputmode="decimal" autocomplete="off"></label>
  <div class="m-row">
    <label>Shares<input id="f-shares" type="text" inputmode="decimal" autocomplete="off"></label>
    <label>Average buy price<input id="f-avg" type="text" inputmode="decimal" autocomplete="off"></label>
  </div>
  <label>Name<input id="f-name" type="text" autocomplete="off"></label>
  <div class="m-row">
    <label>Ticker<input id="f-ticker" type="text" autocomplete="off"></label>
    <label>Exchange<input id="f-exchange" type="text" autocomplete="off"></label>
  </div>
  <div class="m-row">
    <label>Live-price symbol <span class="hint">(Yahoo, e.g. VWCE.DE)</span><input id="f-yahoo" type="text" autocomplete="off"></label>
    <label>Yesterday&rsquo;s close <span class="hint">(auto from live)</span><input id="f-prev" type="text" inputmode="decimal" autocomplete="off"></label>
  </div>
  <p class="err" id="mErr"></p>
  <div class="m-actions">
    <button class="btn danger" id="mDelete">Delete</button>
    <span class="spacer"></span>
    <button class="btn ghost" id="mCancel">Cancel</button>
    <button class="btn primary" id="mSave">Save</button>
  </div>
</div>

<!-- Light privacy lock (not strong security — this page is public on GitHub Pages) -->
<div class="lock" id="lock">
  <div class="lock-card">
    <div class="lock-logo">E&amp;F</div>
    <h1 class="lock-title" id="lockTitle">Enter passcode</h1>
    <p class="lock-help" id="lockHelp">Enter your passcode to continue.</p>
    <input class="lock-input" id="lockInput" type="password" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64" aria-label="Passcode">
    <p class="lock-err" id="lockErr"></p>
    <button class="btn primary lock-go" id="lockGo">Unlock</button>
    <button class="btn ghost lock-bio" id="lockBio" style="display:none">Use Face ID</button>
    <label class="lock-remember" id="lockRememberRow"><input type="checkbox" id="lockRemember" checked> Keep me unlocked on this device</label>
    <button class="lock-reset" id="lockReset">Reset (erases this device&rsquo;s data)</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var store=(function(){try{var k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return localStorage;}
    catch(e){var m={};return{getItem:function(k){return k in m?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];}};}})();
  var KEY="ef_portfolio_v1", SET="ef_settings_v1", PIN="ef_pin_v1", REMEMBER="ef_remember_v1", BIO="ef_bio_v1";

  // Single pre-loaded holding: VWCE, €25,000 invested at today's rate (break-even at open).
  // P0 is only a placeholder shown before the first live refresh; on the first successful
  // refresh the seedInvest logic recomputes shares from the real live price so cost == value.
  var P0=140.00;
  var DEFAULTS=[
    {id:"vwce", name:"Vanguard FTSE All-World", ticker:"VWCE", exchange:"Xetra · IBIS2",
     shares:25000/P0, costBasis:25000, currentPrice:P0, prevClose:P0, currency:"EUR", yahoo:"VWCE.DE", seedInvest:25000}
  ];

  function loadState(){try{var r=store.getItem(KEY);if(r){var p=JSON.parse(r);if(Array.isArray(p)&&p.length)return p;}}catch(e){}return JSON.parse(JSON.stringify(DEFAULTS));}
  function loadSettings(){try{var r=store.getItem(SET);if(r)return JSON.parse(r);}catch(e){}return{calm:true,updated:Date.now()};}
  var state=loadState();
  var settings=loadSettings();
  if(!settings.updated) settings.updated=Date.now();
  function save(){try{store.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function saveSettings(){try{store.setItem(SET,JSON.stringify(settings));}catch(e){}}
  save(); saveSettings();

  function ccy(c){return c||"EUR";}
  function fmt0(n,c){return new Intl.NumberFormat("en-IE",{style:"currency",currency:ccy(c),maximumFractionDigits:0}).format(n);}
  function fmt2(n,c){return new Intl.NumberFormat("en-IE",{style:"currency",currency:ccy(c),minimumFractionDigits:2,maximumFractionDigits:2}).format(n);}
  function fmtShares(n){return new Intl.NumberFormat("en-IE",{maximumFractionDigits:4}).format(n);}
  function s0(n,c){return (n>=0?"+":"−")+fmt0(Math.abs(n),c);}
  function s2(n,c){return (n>=0?"+":"−")+fmt2(Math.abs(n),c);}
  function num(v){return parseFloat(String(v).trim().replace(/\s/g,"").replace(",", "."));}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function baseCcy(){return state.length?ccy(state[0].currency):"EUR";}

  function totals(){
    var cost=0,mv=0,today=0,hasToday=false;
    state.forEach(function(h){
      cost+=h.costBasis; mv+=h.shares*h.currentPrice;
      if(typeof h.prevClose==="number"){today+=(h.currentPrice-h.prevClose)*h.shares;hasToday=true;}
    });
    return {cost:cost,mv:mv,gain:mv-cost,gainPct:cost?((mv-cost)/cost*100):0,today:today,hasToday:hasToday};
  }
  function relTime(ts){
    try{
      var d=new Date(ts), now=new Date();
      if(d.toDateString()===now.toDateString())
        return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
      return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    }catch(e){return "";}
  }

  var hero=document.getElementById("hero");
  var holdings=document.getElementById("holdings");

  function renderHero(){
    var t=totals(); var calmOff=!settings.calm; var c=baseCcy();
    var gw=t.mv>0?Math.max(0,t.gain)/t.mv*100:0;
    var pos=t.gain>=0;
    var reassure = pos
      ? "Day-to-day swings are noise. The trend that matters is the one over years — and it’s up."
      : "A quiet stretch in the markets. Long-term investing rewards patience. Stay the course.";
    var todayHTML="";
    if(calmOff && t.hasToday){
      var good=t.today>=0;
      todayHTML='<div class="today '+(good?"t-pos":"t-dip")+'">Today '+s0(t.today,c)+
        '<span class="today-note">'+(good?"a gentle day up":"a small dip — zoom out")+'</span></div>';
    }
    hero.innerHTML=
      '<div class="hero reveal">'+
        '<div class="hero-label">Total gains since you began</div>'+
        '<div class="hero-num '+(pos?"pos":"neg")+'">'+s0(t.gain,c)+'</div>'+
        '<div class="hero-sub"><span class="pct '+(pos?"":"neg")+'">'+(pos?"+":"−")+Math.abs(t.gainPct).toFixed(1)+'%</span> &middot; '+fmt0(t.cost,c)+' invested</div>'+
        '<div class="bar"><div class="bar-invested"></div><div class="bar-gain" style="width:'+gw.toFixed(2)+'%"></div></div>'+
        '<div class="bar-legend"><span>'+fmt0(t.cost,c)+' invested</span><span class="now">Now '+fmt0(t.mv,c)+'</span></div>'+
        '<p class="reassure">'+reassure+'</p>'+
        todayHTML+
      '</div>';
  }

  function renderHoldings(){
    var t=totals(); var calmOff=!settings.calm;
    document.getElementById("hcount").textContent=state.length+(state.length===1?" position":" positions");
    holdings.innerHTML=state.map(function(h,i){
      var c=ccy(h.currency);
      var mv=h.shares*h.currentPrice, avg=h.costBasis/h.shares, unreal=mv-h.costBasis;
      var pctP=t.mv>0?mv/t.mv*100:0;
      var todayHTML="";
      if(calmOff && typeof h.prevClose==="number"){
        var td=(h.currentPrice-h.prevClose)*h.shares, tpct=h.prevClose?((h.currentPrice-h.prevClose)/h.prevClose*100):0;
        todayHTML='<div class="card-today '+(td>=0?"g":"dip")+'">Today '+s0(td,c)+' ('+(td>=0?"+":"−")+Math.abs(tpct).toFixed(2)+'%)</div>';
      }
      var lookup=h.yahoo?'<a class="lookup" href="https://finance.yahoo.com/quote/'+encodeURIComponent(h.yahoo)+'" target="_blank" rel="noopener">View on Yahoo &#8599;</a>':'';
      return '<div class="card reveal" data-id="'+h.id+'" style="animation-delay:'+(i*60)+'ms">'+
        '<div class="card-top"><div><div class="name">'+esc(h.name)+'</div>'+
          '<div class="ticker">'+esc(h.ticker||"")+(h.exchange?(" · "+esc(h.exchange)):"")+'</div></div>'+
          '<div class="cur"><div class="cur-price"><span class="freshdot '+((h.liveAt && (Date.now()-h.liveAt<900000))?"on":"off")+'"></span>'+fmt2(h.currentPrice,c)+'</div><div class="cur-share">per share</div></div></div>'+
        '<div class="grid">'+
          '<div class="cell"><span class="k">Market Value</span><span class="v">'+fmt0(mv,c)+'</span></div>'+
          '<div class="cell"><span class="k">Unrealized P&amp;L</span><span class="v pill '+(unreal>=0?"g":"r")+'">'+s2(unreal,c)+'</span></div>'+
          '<div class="cell"><span class="k">Average Price</span><span class="v">'+fmt2(avg,c)+'</span></div>'+
          '<div class="cell"><span class="k">% of Portfolio</span><span class="v">'+pctP.toFixed(2)+'%</span></div>'+
          '<div class="cell"><span class="k">Cost Basis</span><span class="v">'+fmt0(h.costBasis,c)+'</span></div>'+
          '<div class="cell"><span class="k">Position</span><span class="v">'+fmtShares(h.shares)+' sh</span></div>'+
        '</div>'+todayHTML+
        '<div class="card-actions"><button class="update" data-id="'+h.id+'">Update price</button>'+lookup+'</div>'+
      '</div>';
    }).join("");
  }

  function renderAll(){renderHero();renderHoldings();}

  // ─────────────────── Live prices: Yahoo v8 chart via CORS-proxy fallbacks ───────────────────
  var HOSTS=["query1.finance.yahoo.com","query2.finance.yahoo.com"];
  function yurl(host,s){return "https://"+host+"/v8/finance/chart/"+encodeURIComponent(s)+"?interval=1d&range=5d&_="+Date.now();}
  var PROXIES=[
    function(u){return "https://api.allorigins.win/raw?url="+encodeURIComponent(u);},
    function(u){return "https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u);},
    function(u){return "https://corsproxy.io/?url="+encodeURIComponent(u);},
    function(u){return "https://api.allorigins.win/get?url="+encodeURIComponent(u);}
  ];
  function fetchText(url){
    var c=new AbortController(); var id=setTimeout(function(){c.abort();},9000);
    return fetch(url,{signal:c.signal,cache:"no-store"}).then(function(r){
      clearTimeout(id); if(!r.ok) throw new Error("http "+r.status); return r.text();
    }).catch(function(e){clearTimeout(id);throw e;});
  }
  function parseYahoo(text){
    var json=JSON.parse(text);
    if(json && typeof json.contents==="string"){ json=JSON.parse(json.contents); } // allorigins/get wrapper
    var res=json && json.chart && json.chart.result && json.chart.result[0];
    var meta=res && res.meta;
    if(meta && typeof meta.regularMarketPrice==="number"){
      var prev = (typeof meta.chartPreviousClose==="number")?meta.chartPreviousClose
               : (typeof meta.previousClose==="number")?meta.previousClose:null;
      return {price:meta.regularMarketPrice, currency:meta.currency||null, prevClose:prev};
    }
    throw new Error("no price in payload");
  }
  function fetchQuote(symbol){
    var attempts=[];
    HOSTS.forEach(function(host){ PROXIES.forEach(function(mk){ attempts.push(mk(yurl(host,symbol))); }); });
    var i=0;
    function tryNext(){
      if(i>=attempts.length) return Promise.reject(new Error("all attempts failed"));
      return fetchText(attempts[i++]).then(parseYahoo).catch(function(){return tryNext();});
    }
    return tryNext();
  }

  function setStatus(kind,a,b){
    var el=document.getElementById("statusline"), btn=document.getElementById("refreshBtn");
    btn.classList.toggle("spin", kind==="updating");
    var t=relTime(settings.updated);
    if(kind==="updating") el.innerHTML='<span class="dotpulse"></span> Updating prices…';
    else if(kind==="live") el.innerHTML='<span class="live-dot"></span> Live &middot; '+t;
    else if(kind==="partial") el.innerHTML='<span class="warn-dot"></span> Updated '+a+' of '+b+' &middot; tap ↻ to retry';
    else if(kind==="offline") el.innerHTML='<span class="off-dot"></span> Couldn’t refresh &middot; showing last values';
    else if(kind==="manual") el.innerHTML='<span class="off-dot"></span> Manual &middot; updated '+t;
    else el.innerHTML='<span class="off-dot"></span> Updated '+t;
  }

  var refreshing=false;
  function refreshPrices(){
    if(refreshing) return;
    var withSym=state.filter(function(h){return h.yahoo && String(h.yahoo).trim();});
    if(!withSym.length){ setStatus("manual"); return; }
    refreshing=true; setStatus("updating");
    var total=withSym.length;
    function pass(list,left){
      var failed=[];
      var chain=Promise.resolve();
      list.forEach(function(h){
        chain=chain.then(function(){
          return fetchQuote(String(h.yahoo).trim()).then(function(q){
            h.currentPrice=q.price;
            if(q.currency) h.currency=q.currency;
            if(typeof q.prevClose==="number") h.prevClose=q.prevClose;
            // Seed at "today's rate": on first live price, set shares so cost == value (break-even).
            if(h.seedInvest){ h.shares=h.seedInvest/q.price; h.costBasis=h.seedInvest; delete h.seedInvest; }
            h.liveAt=Date.now();
          }).catch(function(){ failed.push(h); });
        });
      });
      return chain.then(function(){
        if(failed.length && left>0){
          return new Promise(function(res){setTimeout(res,700);}).then(function(){return pass(failed,left-1);});
        }
        return failed;
      });
    }
    pass(withSym,2).then(function(failed){
      refreshing=false;
      var live=total-failed.length;
      if(live>0){ settings.updated=Date.now(); save(); saveSettings(); renderAll(); }
      if(failed.length===0) setStatus("live");
      else if(live>0) setStatus("partial",live,total);
      else setStatus("offline");
    });
  }

  // ─────────────────── Calm toggle ───────────────────
  var calmEl=document.getElementById("calm");
  calmEl.checked=!!settings.calm;
  calmEl.addEventListener("change",function(){settings.calm=calmEl.checked;saveSettings();renderAll();});

  // ─────────────────── Modal ───────────────────
  var backdrop=document.getElementById("backdrop"), modal=document.getElementById("modal");
  var F={current:"f-current",shares:"f-shares",avg:"f-avg",name:"f-name",ticker:"f-ticker",exchange:"f-exchange",prev:"f-prev",yahoo:"f-yahoo"};
  function val(k){return document.getElementById(F[k]).value;}
  function setVal(k,v){document.getElementById(F[k]).value=(v===undefined||v===null)?"":v;}
  function round(n,d){var f=Math.pow(10,d);return Math.round(n*f)/f;}
  var editingId=null;
  function openModal(id){
    editingId=id;
    var del=document.getElementById("mDelete");
    document.getElementById("mErr").style.display="none";
    if(id){
      var h=state.filter(function(x){return x.id===id;})[0];
      document.getElementById("mTitle").textContent="Edit "+(h.name||"holding");
      setVal("current",round(h.currentPrice,4)); setVal("shares",round(h.shares,4));
      setVal("avg",round(h.costBasis/h.shares,4)); setVal("name",h.name);
      setVal("ticker",h.ticker||""); setVal("exchange",h.exchange||"");
      setVal("yahoo",h.yahoo||""); setVal("prev",(typeof h.prevClose==="number")?round(h.prevClose,4):"");
      del.style.display="block";
    }else{
      document.getElementById("mTitle").textContent="Add a holding";
      ["current","shares","avg","name","ticker","exchange","prev","yahoo"].forEach(function(k){setVal(k,"");});
      del.style.display="none";
    }
    backdrop.classList.add("show"); modal.classList.add("show");
  }
  function closeModal(){backdrop.classList.remove("show");modal.classList.remove("show");editingId=null;}
  function showErr(m){var e=document.getElementById("mErr");e.textContent=m;e.style.display="block";}

  document.getElementById("addBtn").addEventListener("click",function(){openModal(null);});
  document.getElementById("refreshBtn").addEventListener("click",refreshPrices);
  backdrop.addEventListener("click",closeModal);
  document.getElementById("mCancel").addEventListener("click",closeModal);
  holdings.addEventListener("click",function(e){
    if(e.target.closest(".lookup")) return;
    var card=e.target.closest(".card"); if(card) openModal(card.getAttribute("data-id"));
  });
  document.getElementById("mDelete").addEventListener("click",function(){
    if(!editingId)return;
    if(confirm("Remove this holding?")){
      state=state.filter(function(x){return x.id!==editingId;});
      settings.updated=Date.now(); save(); saveSettings(); closeModal(); renderAll();
    }
  });
  document.getElementById("mSave").addEventListener("click",function(){
    var current=num(val("current")), shares=num(val("shares")), avg=num(val("avg")), name=val("name").trim();
    if(!name) return showErr("Please give it a name.");
    if(!(shares>0)) return showErr("Shares must be greater than 0.");
    if(!(avg>=0)) return showErr("Average buy price isn’t valid.");
    if(!(current>=0)) return showErr("Current price isn’t valid.");
    var prevRaw=val("prev").trim(); var prev=prevRaw===""?null:num(prevRaw);
    if(prevRaw!=="" && !(prev>=0)) return showErr("Yesterday’s close isn’t valid.");
    var rec={name:name, ticker:val("ticker").trim().toUpperCase(), exchange:val("exchange").trim(),
      shares:shares, costBasis:round(avg*shares,2), currentPrice:current, prevClose:prev,
      yahoo:val("yahoo").trim()};
    if(editingId){
      // Manual edit wins — drop the seed flag so a later refresh won't overwrite the figures.
      state=state.map(function(x){if(x.id===editingId){var m=Object.assign({},x,rec);delete m.seedInvest;return m;}return x;});
    }else{
      rec.currency="EUR";
      rec.id=(rec.ticker||name).toLowerCase().replace(/[^a-z0-9]/g,"")+"_"+Math.random().toString(36).slice(2,6);
      state.push(rec);
    }
    settings.updated=Date.now(); save(); saveSettings(); closeModal(); renderAll();
    if(rec.yahoo) refreshPrices();
  });
  document.getElementById("resetBtn").addEventListener("click",function(){
    if(confirm("Restore the original VWCE figure (€25,000 at today’s rate)? This replaces what’s here now.")){
      state=JSON.parse(JSON.stringify(DEFAULTS)); settings.updated=Date.now(); save(); saveSettings(); renderAll(); refreshPrices();
    }
  });

  // refresh when app regains focus, if last update was a while ago
  document.addEventListener("visibilitychange",function(){
    if(unlocked && document.visibilityState==="visible" && (Date.now()-settings.updated>180000)) refreshPrices();
  });

  // ─────────────────── Boot (runs only after unlock) ───────────────────
  var booted=false;
  function boot(){
    if(booted) return; booted=true;
    renderAll();
    setStatus("manual");
    setTimeout(refreshPrices,350);
  }

  // ─────────────────── Passcode lock (light privacy, not strong security) ───────────────────
  // The passcode is baked in as a SHA-256 hash so the SAME code works on every device.
  // IMPORTANT: this page is PUBLIC on GitHub Pages — the lock only hides the on-screen
  // figures from a casual glance. It is NOT real security and does not encrypt anything;
  // anyone with the link can read the raw page source.
  var PRESET_SHA256="f90b8e28333f7c730782d474d5862bf4effec6176c2ec640b1d2a75c2d867c64";
  var unlocked=false;

  function sha256Hex(str){
    try{
      var data=new TextEncoder().encode(str);
      return crypto.subtle.digest("SHA-256",data).then(function(buf){
        var b=new Uint8Array(buf), h="";
        for(var i=0;i<b.length;i++){h+=(b[i]<16?"0":"")+b[i].toString(16);}
        return h;
      });
    }catch(e){ return Promise.reject(e); }
  }

  // Face ID / Touch ID via WebAuthn (optional, per device). The biometric check is local —
  // a successful prompt unlocks the UI. Like the passcode, this is convenience / light privacy,
  // not encryption of the (public) page.
  function bioSupported(){return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);}
  function bioGet(){try{return JSON.parse(store.getItem(BIO)||"null");}catch(e){return null;}}
  function rand(n){var a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);return a;}
  function b64u(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
  function unb64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var bin=atob(s),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b.buffer;}
  function bioRegister(){
    return navigator.credentials.create({publicKey:{
      challenge:rand(32),
      rp:{name:"E&F Portfolio"},
      user:{id:rand(16),name:"ef-portfolio",displayName:"E&F Portfolio"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},
      timeout:60000, attestation:"none"
    }}).then(function(cred){ store.setItem(BIO,JSON.stringify({id:b64u(cred.rawId)})); return true; });
  }
  function bioAuth(){
    var rec=bioGet(); if(!rec) return Promise.reject(new Error("not registered"));
    return navigator.credentials.get({publicKey:{
      challenge:rand(32),
      allowCredentials:[{type:"public-key",id:unb64u(rec.id)}],
      userVerification:"required", timeout:60000
    }}).then(function(){return true;});
  }

  var lockEl=document.getElementById("lock"),
      lockInput=document.getElementById("lockInput"),
      lockTitle=document.getElementById("lockTitle"),
      lockHelp=document.getElementById("lockHelp"),
      lockErr=document.getElementById("lockErr"),
      lockGo=document.getElementById("lockGo"),
      lockBio=document.getElementById("lockBio"),
      lockRemember=document.getElementById("lockRemember"),
      lockRememberRow=document.getElementById("lockRememberRow");

  function lockError(m){lockErr.style.color="var(--red)";lockErr.textContent=m;lockInput.value="";lockInput.focus();}
  function lockHint(m){lockErr.style.color="var(--muted)";lockErr.textContent=m;}

  function doUnlock(){
    unlocked=true;
    lockEl.classList.remove("show");
    document.getElementById("app").style.display="";
    boot();
  }

  function verifyPass(){
    var v=lockInput.value;
    if(!v) return Promise.reject("empty");
    return sha256Hex(v).then(function(h){return h===PRESET_SHA256;});
  }
  function passUnlock(){
    verifyPass().then(function(ok){
      if(!ok) return lockError("Incorrect passcode.");
      if(lockRemember && lockRemember.checked){try{store.setItem(REMEMBER,"1");}catch(e){}}
      doUnlock();
    }).catch(function(e){
      lockError(e==="empty"?"Enter your passcode.":"This device can’t verify the passcode (needs HTTPS).");
    });
  }
  function setupBio(){
    verifyPass().then(function(ok){
      if(!ok) return lockError("Enter your passcode first, then tap Set up Face ID.");
      lockBio.disabled=true; lockErr.textContent="";
      bioRegister().then(function(){ lockBio.disabled=false; doUnlock(); })
        .catch(function(){ lockBio.disabled=false; lockError("Couldn’t set up Face ID — you can still use your passcode."); });
    }).catch(function(e){
      lockError(e==="empty"?"Enter your passcode first, then tap Set up Face ID.":"This device can’t verify the passcode.");
    });
  }
  function useBio(){
    lockBio.disabled=true; lockErr.textContent="";
    bioAuth().then(function(){ lockBio.disabled=false; doUnlock(); })
      .catch(function(){ lockBio.disabled=false; lockHint("Face ID didn’t complete — enter your passcode, or tap Use Face ID to try again."); });
  }

  function showLock(){
    lockEl.classList.add("show");
    lockErr.textContent=""; lockInput.value="";
    lockTitle.textContent="Unlock"; lockGo.textContent="Unlock";
    if(bioGet()){
      lockHelp.textContent="Unlock with Face ID, or enter your passcode.";
      lockBio.textContent="Use Face ID"; lockBio.style.display="block"; lockBio.onclick=useBio;
      lockRememberRow.style.display="none";
    }else{
      lockHelp.textContent="Enter the passcode to open E&F Portfolio.";
      if(bioSupported()){ lockBio.textContent="Set up Face ID"; lockBio.style.display="block"; lockBio.onclick=setupBio; }
      else { lockBio.style.display="none"; }
      lockRememberRow.style.display="flex";
    }
    setTimeout(function(){lockInput.focus();},60);
  }

  function startLock(){
    if(bioGet() && bioSupported()){ showLock(); setTimeout(useBio,250); return; }
    if(store.getItem(REMEMBER)==="1"){ doUnlock(); return; }
    showLock();
  }

  lockGo.addEventListener("click",passUnlock);
  lockInput.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();passUnlock();}});
  document.getElementById("lockReset").addEventListener("click",function(){
    if(confirm("Reset this device? This turns off Face ID and ‘keep me unlocked’, and erases any portfolio data saved on THIS device. It cannot be undone.")){
      try{store.removeItem(KEY);store.removeItem(SET);store.removeItem(PIN);store.removeItem(REMEMBER);store.removeItem(BIO);}catch(e){}
      location.reload();
    }
  });

  // ─────────────────── Start: show the lock first ───────────────────
  startLock();
})();
</script>
